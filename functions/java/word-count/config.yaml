# Word Count Function 部署配置
tenant: public
namespace: default
name: word-count
className: com.example.pulsar.WordCountFunction
inputs:
  - persistent://public/default/sentences
output: persistent://public/default/word-counts
autoAck: true
parallelism: 1
resources:
  cpu: 0.5
  ram: 536870912  # 512MB
  disk: 1073741824  # 1GB
