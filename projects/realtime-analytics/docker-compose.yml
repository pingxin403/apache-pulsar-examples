version: '3.8'

services:
  pulsar:
    image: apachepulsar/pulsar:3.2.0
    container_name: pulsar-analytics
    ports:
      - "6650:6650"
      - "8080:8080"
    command: bin/pulsar standalone
    healthcheck:
      test: ["CMD-SHELL", "bin/pulsar-admin brokers healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 10

  # 事件生产者 - 模拟用户行为
  event-producer:
    build:
      context: ./event-producer
    container_name: event-producer
    depends_on:
      pulsar:
        condition: service_healthy
    environment:
      - PULSAR_URL=pulsar://pulsar:6650
      - EVENTS_PER_SECOND=10

  # 事件处理器 - 实时聚合
  event-processor:
    build:
      context: ./event-processor
    container_name: event-processor
    depends_on:
      pulsar:
        condition: service_healthy
    environment:
      - PULSAR_URL=pulsar://pulsar:6650
