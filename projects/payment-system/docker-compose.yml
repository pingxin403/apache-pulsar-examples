version: '3.8'

services:
  pulsar:
    image: apachepulsar/pulsar:3.2.0
    container_name: pulsar-payment
    ports:
      - "6650:6650"
      - "8080:8080"
    command: bin/pulsar standalone --transaction-coordinator-enabled
    healthcheck:
      test: ["CMD-SHELL", "bin/pulsar-admin brokers healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 10
